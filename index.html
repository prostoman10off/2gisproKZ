<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подбор рубрик для 2ГисПРО Казахстан</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }

    .left-panel,
    .right-panel {
      background: #fff;
      border: 1px solid #d9e0ea;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .panel-title {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .panel-subtitle {
      font-size: 14px;
      color: #666;
      margin: 0 0 15px;
    }

    .counter-box {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f4f8ff;
      border: 1px solid #d8e6ff;
      color: #2f4f7f;
      font-size: 14px;
      font-weight: 700;
    }

    .limit-message {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff1f1;
      border: 1px solid #ffb8b8;
      color: #d62828;
      font-size: 14px;
      font-weight: 700;
    }

    .limit-message.show {
      display: block;
    }

    .category-block {
      border: 1px solid #e3e8ef;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      background: #fcfdff;
    }

    .category-header {
      width: 100%;
      border: none;
      background: #eef4ff;
      padding: 14px 16px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .category-header:hover {
      background: #e4eeff;
    }

    .arrow {
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .category-block.open .arrow {
      transform: rotate(180deg);
    }

    .subcategory-list {
      display: none;
      padding: 12px 16px 16px;
      background: #fff;
    }

    .category-block.open .subcategory-list {
      display: block;
    }

    .subcategory-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f5;
    }

    .subcategory-item:last-child {
      border-bottom: none;
    }

    .subcategory-item label {
      cursor: pointer;
      line-height: 1.4;
    }

    .selected-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .selected-item {
      background: #f4f8ff;
      border: 1px solid #d8e6ff;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .selected-text {
      font-size: 14px;
      line-height: 1.4;
    }

    .remove-btn {
      border: none;
      background: #d9534f;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .remove-btn:hover {
      background: #c73f3a;
    }

    .empty {
      color: #777;
      font-size: 14px;
      padding: 10px 0;
    }

    .search-box {
      width: 100%;
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d9e0ea;
      border-radius: 10px;
      font-size: 14px;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      background: #2f6fed;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .action-btn.secondary {
      background: #6c757d;
    }

    .action-btn:hover {
      opacity: 0.92;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .right-panel {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Подбор рубрик для 2ГисПро Казахстан</h1>

    <div class="layout">
      <div class="left-panel">
        <h2 class="panel-title">Выберите 10 рубрик из выпадающего списка</h2>

        <div id="counterBox" class="counter-box">
          Выбрано рубрик: 0
        </div>

        <div id="limitMessage" class="limit-message">
          Свыше 10 оплачивается дополнительно
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск по рубрикам..." />
        </div>

        <div id="categoriesContainer">
          <div class="empty">Загрузка данных...</div>
        </div>
      </div>

      <div class="right-panel">
        <h2 class="panel-title">Выбранные рубрики</h2>
        <div class="panel-subtitle">ID рубрики - Название</div>

        <div id="selectedList" class="selected-list">
          <div class="empty">Пока ничего не выбрано.</div>
        </div>

        <div class="actions">
          <button class="action-btn" id="copyBtn">Скопировать список</button>
          <button class="action-btn secondary" id="clearBtn">Очистить всё</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EXCEL_FILE = './rubrics.xlsx';

    let groupedData = {};
    let selectedItems = new Map();

    async function loadExcel() {
      try {
        const response = await fetch(EXCEL_FILE);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        const rows = XLSX.utils.sheet_to_json(worksheet, {
          header: 1,
          defval: ''
        });

        parseRows(rows);
        renderCategories(groupedData);
        renderSelected();
        updateLimitMessage();
        updateCounter();
      } catch (error) {
        console.error('Ошибка загрузки Excel:', error);
        document.getElementById('categoriesContainer').innerHTML =
          '<div class="empty">Не удалось загрузить файл Excel. Проверь, что GitHub Pages включен и файл rubrics.xlsx лежит в корне репозитория.</div>';
      }
    }

    function parseRows(rows) {
      groupedData = {};

      rows.forEach((row, index) => {
        const level2 = (row[1] || '').toString().trim();
        const rubric = (row[2] || '').toString().trim();
        const code = (row[3] || '').toString().trim();

        if (!level2 || !rubric) return;

        if (
          index === 0 &&
          (
            level2.toLowerCase().includes('рубр') ||
            rubric.toLowerCase().includes('рубр') ||
            code.toLowerCase().includes('код')
          )
        ) {
          return;
        }

        if (!groupedData[level2]) {
          groupedData[level2] = [];
        }

        const exists = groupedData[level2].some(item =>
          item.rubric === rubric && item.code === code
        );

        if (!exists) {
          groupedData[level2].push({
            code,
            rubric
          });
        }
      });
    }

    function renderCategories(data) {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      const entries = Object.entries(data);

      if (!entries.length) {
        container.innerHTML = '<div class="empty">Нет данных для отображения.</div>';
        return;
      }

      entries.forEach(([category, subcategories], categoryIndex) => {
        const block = document.createElement('div');
        block.className = 'category-block';

        const header = document.createElement('button');
        header.className = 'category-header';
        header.type = 'button';
        header.innerHTML = `
          <span>${escapeHtml(category)}</span>
          <span class="arrow">▼</span>
        `;

        header.addEventListener('click', () => {
          block.classList.toggle('open');
        });

        const list = document.createElement('div');
        list.className = 'subcategory-list';

        subcategories.forEach((itemData, subIndex) => {
          const item = document.createElement('div');
          item.className = 'subcategory-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.id = `cb_${categoryIndex}_${subIndex}`;
          checkbox.checked = selectedItems.has(makeKey(category, itemData.code, itemData.rubric));

          checkbox.addEventListener('change', (e) => {
            const key = makeKey(category, itemData.code, itemData.rubric);

            if (e.target.checked) {
              selectedItems.set(key, {
                category,
                code: itemData.code,
                sub: itemData.rubric
              });
            } else {
              selectedItems.delete(key);
            }

            renderSelected();
            updateLimitMessage();
            updateCounter();
          });

          const label = document.createElement('label');
          label.htmlFor = checkbox.id;
          label.textContent = itemData.rubric;

          item.appendChild(checkbox);
          item.appendChild(label);
          list.appendChild(item);
        });

        block.appendChild(header);
        block.appendChild(list);
        container.appendChild(block);
      });
    }

    function renderSelected() {
      const selectedList = document.getElementById('selectedList');
      selectedList.innerHTML = '';

      if (selectedItems.size === 0) {
        selectedList.innerHTML = '<div class="empty">Пока ничего не выбрано.</div>';
        return;
      }

      Array.from(selectedItems.values()).forEach(({ category, code, sub }) => {
        const item = document.createElement('div');
        item.className = 'selected-item';

        const text = document.createElement('div');
        text.className = 'selected-text';
        text.textContent = code ? `${code} — ${sub}` : sub;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Удалить';

        removeBtn.addEventListener('click', () => {
          selectedItems.delete(makeKey(category, code, sub));
          rerenderCurrent();
          updateLimitMessage();
          updateCounter();
        });

        item.appendChild(text);
        item.appendChild(removeBtn);
        selectedList.appendChild(item);
      });
    }

    function updateLimitMessage() {
      const limitMessage = document.getElementById('limitMessage');

      if (selectedItems.size >= 11) {
        limitMessage.classList.add('show');
      } else {
        limitMessage.classList.remove('show');
      }
    }

    function updateCounter() {
      const counterBox = document.getElementById('counterBox');
      counterBox.textContent = `Выбрано рубрик: ${selectedItems.size}`;
    }

    function rerenderCurrent() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      if (!query) {
        renderCategories(groupedData);
      } else {
        const filtered = {};

        Object.entries(groupedData).forEach(([category, items]) => {
          const categoryMatch = category.toLowerCase().includes(query);
          const itemMatches = items.filter(item =>
            item.rubric.toLowerCase().includes(query) ||
            item.code.toLowerCase().includes(query)
          );

          if (categoryMatch) {
            filtered[category] = items;
          } else if (itemMatches.length) {
            filtered[category] = itemMatches;
          }
        });

        renderCategories(filtered);

        document.querySelectorAll('.category-block').forEach(block => {
          block.classList.add('open');
        });
      }

      renderSelected();
      updateLimitMessage();
      updateCounter();
    }

    function makeKey(category, code, sub) {
      return `${category}|||${code}|||${sub}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.getElementById('searchInput').addEventListener('input', rerenderCurrent);

    document.getElementById('clearBtn').addEventListener('click', () => {
      selectedItems.clear();
      rerenderCurrent();
      updateLimitMessage();
      updateCounter();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (selectedItems.size === 0) {
        alert('Нет выбранных рубрик для копирования.');
        return;
      }

      const text = Array.from(selectedItems.values())
        .map(item => item.code ? `${item.code} — ${item.sub}` : item.sub)
        .join('\n');

      try {
        await navigator.clipboard.writeText(text);
        alert('Список скопирован.');
      } catch (e) {
        alert('Не удалось скопировать список.');
      }
    });

    loadExcel();
  </script>
</body>
</html>
